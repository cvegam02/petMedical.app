services:
  waha:
    image: devlikeapro/waha
    container_name: waha
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      WHATSAPP_API_KEY: "cambia-esto-por-una-clave-segura"
      WHATSAPP_HOOK_URL: ""
    volumes:
      - waha_sessions:/app/.sessions

volumes:
  waha_sessions:
